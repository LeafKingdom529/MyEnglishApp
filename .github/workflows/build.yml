name: Build Flet APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install flet
      - name: Build APK
        run: |
          yes | flet build apk --module-name main.py
      - uses: actions/upload-artifact@v4
        with:
          name: flet-apk
          path: build/apk
